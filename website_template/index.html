<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Homepage</title>
  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f8f9fa;
    }
    .container {
      text-align: center;
    }
    .btn {
      width: 280px;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      color: white;
      cursor: pointer;
    }
    .blue { background: #73a9ff; }
    .pink { background: #f7a3d2; }
    .green { background: #88d8b0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Homepage</h1>

    <!-- Click the button to jump to a new page -->
    <button class="btn blue" onclick="window.location.href='market.html'">
      Brand Market Landscape
    </button>

    <button class="btn pink" onclick="window.location.href='consumer.html'">
      Consumer Behavior
    </button>

    <button class="btn green" onclick="window.location.href='recommendation.html'">
      Personalized Recommendation
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
